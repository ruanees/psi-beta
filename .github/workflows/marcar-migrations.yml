# Uso único (ou raro): avisa o histórico do Supabase que migrations rodadas à mão
# no SQL Editor já estão aplicadas. Sem isso o `db push` da publicação tentaria
# rodá-las de novo e pararia em "already exists". Não executa SQL nenhum.
name: marcar migrations

on:
  workflow_dispatch:
    inputs:
      versoes:
        description: Versões já rodadas à mão, separadas por espaço
        required: true
        default: '20261014000001 20261015000001'

jobs:
  marcar:
    name: Marcar como aplicadas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: back
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      VERSOES: ${{ inputs.versoes }}
    steps:
      # Primeiro o checkout: a pasta back/ (working-directory padrão) só existe depois dele.
      - uses: actions/checkout@v4
      - name: Conferir entrada
        run: |
          [[ "$VERSOES" =~ ^[0-9]{14}( [0-9]{14})*$ ]] || {
            echo "::error::Use só números de 14 dígitos separados por espaço, como 20261014000001 20261015000001."
            exit 1
          }
      - name: Cada versão existe no repositório
        run: |
          for v in $VERSOES; do
            ls supabase/migrations/"$v"_*.sql > /dev/null 2>&1 || { echo "::error::Não existe migration $v."; exit 1; }
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: back/package-lock.json
      - run: npm ci
      - run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
      - run: npx supabase migration repair --status applied $VERSOES -p "$SUPABASE_DB_PASSWORD"
      - name: Histórico agora
        run: npx supabase migration list -p "$SUPABASE_DB_PASSWORD"
